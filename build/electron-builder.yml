# electron-builder.yml
# Vision AI Studio Desktop Packaging Specification (macOS arm64 + Windows NSIS)

appId: com.visionaistudio.app
productName: Vision AI Studio
copyright: Copyright © 2026 Vision AI Studio Team

directories:
  output: release
  buildResources: build

beforePack: build/release-hooks.cjs
afterPack: build/release-hooks.cjs

# Exclude unnecessary test caches, markdown files, and unpackaged dev files
files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "package.json"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"

# Extract Python backend into resourcesPath (unpacked from ASAR so Python interpreter can read it)
extraResources:
  - from: "THIRD_PARTY_NOTICES.md"
    to: "THIRD_PARTY_NOTICES.md"
  - from: "LICENSE"
    to: "LICENSE"
  - from: "docs/model-license-matrix.md"
    to: "model-license-matrix.md"
  - from: "dist-backend/vision_ai_backend"
    to: "backend_bin"
    filter:
      - "**/*"
  - from: "native_runtime"
    to: "native_runtime"
    filter:
      - "*.cpp"
      - "*.h"
      - "*.hpp"
      - "*.cs"
      - "*.csproj"
      - "*.py"
      - "*.md"
      - "CMakeLists.txt"
  - from: "examples"
    to: "examples"
    filter:
      - "*.mjs"
      - "*.cs"
  - from: "backend"
    to: "backend"
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyo"
      - "!**/*.pyd"
      - "!**/tests/**"
      - "!**/.pytest_cache/**"

asar: true
asarUnpack:
  - "**/*.node"

# -----------------------------------------------------------------------------
# macOS Configuration (arm64)
# -----------------------------------------------------------------------------
mac:
  appId: com.visionaistudio.app
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  # Ad-hoc sign the bundle: Gatekeeper reports an unsigned download as damaged, while an ad-hoc signed one can be opened
  # from Privacy & Security ("Open Anyway"). electron-builder 26 first matches "-" against keychain identity names and
  # signs with a match, so check that `codesign -dv` on the built app shows Signature=adhoc. While identity is set here,
  # CSC_NAME is ignored and CSC_IDENTITY_AUTO_DISCOVERY=false does not turn signing off (-c.mac.identity=null does).
  # A Developer ID build (-c.mac.identity="<Team Name> (<TEAMID>)") signs only the shell: the frozen backend must be
  # signed with the same identity before scripts/build_backend_binary.py records its inventory.
  identity: "-"
  # Leave the frozen backend exactly as accepted: the supervisor compares its executable's sha256 with
  # backend-release.json at launch, and re-signing would change it. PyInstaller has already ad-hoc signed these files.
  signIgnore:
    - /Contents/Resources/backend_bin/
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
  minimumSystemVersion: "12.0.0"

dmg:
  title: "${productName} ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# -----------------------------------------------------------------------------
# Windows Configuration (x64 NSIS Installer)
# -----------------------------------------------------------------------------
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  legalTrademarks: Vision AI Studio Team

# Native Linux builds have their own executable/dependency/startup acceptance.
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vision AI Studio
  uninstallDisplayName: Vision AI Studio
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
