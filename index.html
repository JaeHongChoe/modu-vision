<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Local backend on a dynamic loopback port, or a shared project server.
         Shared servers must use HTTPS/WSS (loopback HTTP is the SSH-tunnel case);
         plain HTTP to other hosts stays blocked. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:* http://localhost:* https:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:* https: wss:;"
    />
    <title>Vision AI Studio</title>
  </head>
  <body class="bg-industrial-850 text-slate-100 overflow-hidden select-none m-0 p-0 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
