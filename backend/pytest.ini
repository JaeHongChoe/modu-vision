[pytest]
testpaths = tests ../tests backend/tests
pythonpath = . .. backend
addopts = --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    private_qualification: explicit external original-evidence replay requiring MODU_PRIVATE_QA_ROOT; not an ordinary self-contained CI unit test
    tier1: Tier 1 primary feature coverage tests
    tier2: Tier 2 boundary and corner case tests
    e2e: End-to-end multi-task workflow integration tests
