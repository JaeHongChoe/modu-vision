name: Linux native SDK execution

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify required native toolchains
        shell: bash
        run: |
          mkdir -p sdk-evidence
          g++ --version | tee sdk-evidence/compiler.txt
          dotnet --list-sdks | tee sdk-evidence/dotnet.txt
          python3-config --includes | tee sdk-evidence/python-headers.txt
          python -c "import pathlib,re; text=pathlib.Path('sdk-evidence/dotnet.txt').read_text(); assert re.search(r'^8\.',text,re.M), '.NET 8 SDK is required; C# skip is not acceptance'"
      - name: Install locked CPU runtime
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r build/ci/requirements-ubuntu-py313-cpu.lock
      - name: Execute delivered Python, C++ and C# SDKs
        shell: bash
        run: |
          python -m pytest -v -rA --basetemp "$RUNNER_TEMP/native-sdk" --junitxml sdk-evidence/pytest.xml \
            backend/tests/test_runtime_deadline_sdk.py::test_python_predictor_executor_use_same_full_dag_and_strict_options \
            backend/tests/test_runtime_deadline_sdk.py::test_runtime_package_deadline_survives_reopen_and_cli \
            backend/tests/test_runtime_deadline_sdk.py::test_packaged_cpp_native_sdk_embeds_python_and_matches_whole_graph \
            backend/tests/test_runtime_deadline_sdk.py::test_csharp_pinvoke_calls_the_same_native_executor \
            backend/tests/test_runtime_deadline_sdk.py::test_local_dlopen_host_can_import_python_extensions \
            backend/tests/test_sdk_cancellation.py 2>&1 | tee sdk-evidence/execution.log
          python -c "import xml.etree.ElementTree as E; s=E.parse('sdk-evidence/pytest.xml').getroot().find('testsuite'); assert int(s.get('tests'))==9 and int(s.get('skipped'))==0, 'All nine SDK checks must execute without skips'"
      - name: Source and execution receipt
        if: always()
        run: python scripts/write_ci_receipt.py --output sdk-evidence/receipt.json --junit sdk-evidence/pytest.xml
      - name: Preserve native execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-native-sdk-${{ github.sha }}
          path: |
            sdk-evidence
            ${{ runner.temp }}/native-sdk/**/native/*.so
            ${{ runner.temp }}/native-sdk/**/native/vision_predict
            ${{ runner.temp }}/native-sdk/**/native/vision_execute
            ${{ runner.temp }}/native-sdk/**/native/vision_cancel_demo
            ${{ runner.temp }}/native-sdk/**/native/csharp/*.dll
            ${{ runner.temp }}/native-sdk/**/native/csharp/*.json
          retention-days: 14
          if-no-files-found: error
