name: Local browser and shared security

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-browser:
    name: localhost TLS, accounts and shared security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install existing locked CPU environment
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r build/ci/requirements-ubuntu-py313-cpu.lock
      - run: npm ci
      - name: Local HTTPS, storage, account and security regressions
        run: >-
          python -m pytest -q
          backend/tests/test_local_web_state.py
          backend/tests/test_local_web_app.py
          backend/tests/test_local_web_cli.py
          backend/tests/test_shared_web_review.py
          backend/tests/test_shared_accounts.py
          backend/tests/test_service_browser_origins.py
      - name: Launcher and actual-acceptance safeguards
        run: node --test scripts/tests/local-web.test.cjs scripts/tests/local-browser-acceptance.test.cjs
