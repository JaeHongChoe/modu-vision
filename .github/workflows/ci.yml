name: Linux CPU source checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Public contribution runs have no deployment, signing, or GPU credentials.
permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install locked CPU environment
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r build/ci/requirements-ubuntu-py313-cpu.lock
      - run: npm ci
      - name: Check preserved scope and acceptance states
        run: python scripts/check_service_plan.py
      - name: Type checks, renderer regressions, and build
        run: |
          npm run typecheck
          npm run typecheck:e2e
          npm run test:renderer
          npm run build
          npm run test:e2e:harness
      - name: CPU contract and recovery regressions
        run: >-
          python -m pytest -q --junitxml=ci-pytest.xml
          backend/tests/test_flow_class_save_validation.py
          backend/tests/test_source_mask_annotations.py
          backend/tests/test_service_joint_augmentation.py
          backend/tests/test_service_score_contract.py
          backend/tests/test_dataset_index_stat_identity.py
          backend/tests/test_dataset_source_status.py
          backend/tests/test_annotation_save_source_spelling.py
          backend/tests/test_service_release_eligibility.py
          backend/tests/test_fleet_emergency_rollback.py
          backend/tests/test_service_s0_06.py
          backend/tests/test_service_s0_08.py
          backend/tests/test_service_s1_01.py
          backend/tests/test_service_s1_06.py
          backend/tests/test_service_image_path_alias.py
          backend/tests/test_service_ci_dependencies.py
          backend/tests/test_service_s6_01.py
          backend/tests/test_service_s6_05.py
          backend/tests/test_service_s1_04.py
          backend/tests/test_training_runtime_budget.py
          backend/tests/test_service_s1_03.py::test_a_spent_runtime_budget_becomes_one_cancel_intent_and_the_owner_stops_the_job
          backend/tests/test_service_s1_03.py::test_the_queue_api_shows_priority_position_budget_and_wait_reason
          backend/tests/test_service_s1_09.py
          backend/tests/test_service_s1_10.py
          backend/tests/test_service_s6_07.py
          backend/tests/test_sqlite_wal.py
          backend/tests/test_service_s1_02.py
          backend/tests/test_service_s7_01.py
          backend/tests/test_segmentation_mask_folder_classes.py
          backend/tests/test_annotation_source_encoding.py
          backend/tests/test_annotation_truncated_source.py
          backend/tests/test_source_annotation_failure_binding.py
          backend/tests/test_source_coco_relative_paths.py
          backend/tests/test_service_s1_05.py
          backend/tests/test_sqlite_schema.py
          backend/tests/test_service_s1_10_types.py
          backend/tests/test_service_e01.py
          backend/tests/test_service_s2_01.py
          backend/tests/test_extension_adapter_review.py
          backend/tests/test_extension_dino_finetune.py
          backend/tests/test_extension_integration_review.py
          backend/tests/test_extension_ocr_flow_evidence.py
          backend/tests/test_extension_remote_autodl.py
          backend/tests/test_extension_resume_snapshot.py
          backend/tests/test_extension_resume_state.py
          backend/tests/test_extension_root_lane_review.py
          backend/tests/test_extension_search_reuse.py
          backend/tests/test_extension_training_api.py
          backend/tests/test_p04_training_api.py
          backend/tests/test_service_s3_08_extensions.py
          backend/tests/test_service_s3_09_extensions.py
          backend/tests/test_service_s4_06.py
          backend/tests/test_service_s4_07.py
          backend/tests/test_model_comparisons.py
          backend/tests/test_flow_batch_cli.py
          backend/tests/test_product_delivery.py
          scripts/tests/test_publication_audit.py
          backend/tests/test_sdk_cancellation.py::test_interruption_reaps_the_actual_owned_child
          backend/tests/test_mixed_comparison_truth.py
          backend/tests/test_cross_task_comparison.py
          backend/tests/test_comparison_durable_jobs.py
          backend/tests/test_comparison_compute_target.py
          backend/tests/test_comparison_metric_export.py
          backend/tests/test_service_s5_01.py
          backend/tests/test_service_s5_02.py
          backend/tests/test_service_s5_06.py
          backend/tests/test_service_s5_08_drift.py
          backend/tests/test_service_s5_09.py
          backend/tests/test_project_archive_runtime_locks.py
          backend/tests/test_service_s2_05_no_branch.py
          backend/tests/test_service_e02.py
          backend/tests/test_service_e03.py
          backend/tests/test_service_e04.py
          backend/tests/test_service_e07.py
          backend/tests/test_service_e05.py
          backend/tests/test_e05_conflict_identity_contract.py
          backend/tests/test_e05_training_binding_contract.py
          backend/tests/test_ssh_keychain_transport.py
          backend/tests/test_service_e06.py
          backend/tests/test_capture_intake.py
          backend/tests/test_e08_import_recovery.py
          backend/tests/test_e08_backup_recovery.py
          backend/tests/test_e08_restore_recovery.py
          backend/tests/test_e01_service_capture_groups.py
          backend/tests/test_fixture_flow_integration.py
          backend/tests/test_capture_group_deadline_delivery.py
          backend/tests/test_remote_package_parity.py
          backend/tests/test_portable_capture_policy_runtime.py
          backend/tests/test_training_inventory_parity.py
          backend/tests/test_fixture_pose_json_parity.py
          backend/tests/test_service_s1_08.py
          backend/tests/test_anomaly_folder_case.py
      - name: Core defect baseline evidence
        run: python scripts/service_baseline_evidence.py --output ci-baseline-evidence.json
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser transport and flow checks
        env:
          MV_E2E_ARTIFACT_DIR: ${{ runner.temp }}/modu-e2e
        run: npm run test:e2e:browser
      - name: Record source, toolchain, and license inventory
        if: always()
        run: |
          python scripts/write_ci_receipt.py --output ci-receipt.json --junit ci-pytest.xml
          python scripts/license_inventory.py --output ci-license-inventory.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-cpu-${{ github.sha }}
          path: |
            ci-receipt.json
            ci-baseline-evidence.json
            ci-license-inventory.json
            ci-pytest.xml
            ${{ runner.temp }}/modu-e2e
          retention-days: 14
          if-no-files-found: error
