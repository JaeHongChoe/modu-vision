name: Linux CPU source checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Public contribution runs have no deployment, signing, or GPU credentials.
permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  # Preserve running and pending exact-source qualifications across later pushes.
  queue: max
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    # The recorded 5098dac run exhausted 35 minutes after CPU checks passed.
    # Both lanes retain their full selected suites and isolated workspaces.
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Prepare isolated CI records
        run: mkdir -p "${{ runner.temp }}/modu-ci-manifests"
      - name: Install locked CPU environment
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r build/ci/requirements-ubuntu-py313-cpu.lock
      - run: npm ci
      - name: Check preserved scope and acceptance states
        run: |
          python scripts/check_service_plan.py
          python scripts/check_action_evidence.py
      - name: Type checks, renderer regressions, and build
        run: |
          npm run typecheck
          npm run typecheck:e2e
          node scripts/verify-supervisor.js --owned-bootstrap-order
          npm run test:renderer
          npm run build
          npm run test:e2e:harness
          node --test scripts/acceptance/action_inventory.test.cjs
          node --test scripts/tests/release-readiness.test.cjs scripts/tests/package-license-texts.test.cjs scripts/verify-release-recovery.cjs
      - name: CPU contract and recovery regressions
        env:
          MV_CI_RECORD_DIR: ${{ runner.temp }}/modu-ci-manifests
        run: >-
          python -m pytest -q --junitxml="$MV_CI_RECORD_DIR/ci-pytest.xml"
          backend/tests/test_flow_class_save_validation.py
          backend/tests/test_detection_object_rules.py
