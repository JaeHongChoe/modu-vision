name: 기능 제안 (Feature request)
description: 필요한 작업 흐름이나 기능을 제안해 주세요.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 지금 어떤 작업이 어렵거나 불가능한지, 현장 작업 흐름으로 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 데이터셋
        - 라벨링
        - 학습·작업 센터
        - 평가
        - 검사 플로우
        - 검사 서비스·배포
        - 설치·업데이트
        - 개발자 API·자동화
        - 기타
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 완료를 확인하는 방법
      description: 무엇을 실행하면 이 기능이 동작한다고 볼 수 있는지 적어 주세요(실제 장비·모델 품질이 필요한 경우 함께 적어 주세요).
  - type: checkboxes
    id: hygiene
    attributes:
      label: 확인
      options:
        - label: 실제 검사 이미지, 고객 데이터, 개인정보, 비밀번호·토큰·서버 접속 정보를 첨부하지 않았습니다.
          required: true
