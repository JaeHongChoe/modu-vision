<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">Vision AI Studio: 여섯 단계의 작업 흐름</title>
  <desc id="desc">데이터 준비와 라벨 달기, 모델 학습과 결과 평가, 검사 흐름 만들기와 검사 실행을 세 묶음으로 보여 줍니다. AI가 만든 초안은 사람이 검토하고 채택하며 정답 확정, 최종 승인과 운영 배포는 사람이 판단합니다. 성능 수치를 제시한 그림이 아닙니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#0d2033"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122c3f"/><stop offset="1" stop-color="#102334"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto-start-reverse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#5ed8dd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text {font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;fill:#e9f3f8}
    .muted {fill:#a8bfce} .teal {fill:#6fe0dc} .warm {fill:#f3c67c}
    .label {font-weight:700} .line {fill:none;stroke:#5ed8dd;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1200" height="650" rx="24" fill="url(#bg)"/>
  <text x="44" y="38" font-size="14" class="teal label">VISION AI STUDIO  /  WORKFLOW</text>
  <text x="44" y="88" font-size="36" class="label">이미지에서 검사까지, 여섯 단계</text>
  <text x="44" y="125" font-size="22" class="muted">자료와 정답을 준비하고, 모델을 확인한 뒤 검사 흐름을 실행합니다.</text>
  <rect x="44" y="162" width="350" height="298" rx="18" fill="url(#card)" stroke="#244758"/>
  <text x="68" y="201" font-size="25" class="label">자료와 정답</text>
  <text x="370" y="201" font-size="17" class="teal label" text-anchor="end">1-2</text>
  <rect x="64" y="225" width="310" height="86" rx="12" fill="#0b1c2c" stroke="#244758"/>
  <circle cx="97" cy="256" r="17" fill="#164f60"/>
  <text x="97" y="262" font-size="17" class="teal label" text-anchor="middle">1</text>
  <text x="126" y="262" font-size="25" class="label">데이터 준비</text>
  <text x="126" y="290" font-size="17" class="muted">이미지·프로젝트 구성</text>
  <path d="M219 316 v8" class="line" marker-end="url(#arrow)"/>
  <rect x="64" y="328" width="310" height="86" rx="12" fill="#0b1c2c" stroke="#244758"/>
  <circle cx="97" cy="359" r="17" fill="#164f60"/>
  <text x="97" y="365" font-size="17" class="teal label" text-anchor="middle">2</text>
  <text x="126" y="365" font-size="25" class="label">라벨 달기</text>
  <text x="126" y="393" font-size="17" class="muted">정답을 검토하고 확정</text>
  <rect x="424" y="162" width="350" height="298" rx="18" fill="url(#card)" stroke="#244758"/>
  <text x="448" y="201" font-size="25" class="label">모델과 근거</text>
  <text x="750" y="201" font-size="17" class="teal label" text-anchor="end">3-4</text>
  <rect x="444" y="225" width="310" height="86" rx="12" fill="#0b1c2c" stroke="#244758"/>
  <circle cx="477" cy="256" r="17" fill="#164f60"/>
  <text x="477" y="262" font-size="17" class="teal label" text-anchor="middle">3</text>
  <text x="506" y="262" font-size="25" class="label">모델 학습</text>
  <text x="506" y="290" font-size="17" class="muted">설정을 확인하고 학습</text>
  <path d="M599 316 v8" class="line" marker-end="url(#arrow)"/>
  <rect x="444" y="328" width="310" height="86" rx="12" fill="#0b1c2c" stroke="#244758"/>
  <circle cx="477" cy="359" r="17" fill="#164f60"/>
  <text x="477" y="365" font-size="17" class="teal label" text-anchor="middle">4</text>
  <text x="506" y="365" font-size="25" class="label">결과 평가</text>
  <text x="506" y="393" font-size="17" class="muted">저장된 기준으로 결과 확인</text>
  <rect x="804" y="162" width="350" height="298" rx="18" fill="url(#card)" stroke="#244758"/>
  <text x="828" y="201" font-size="25" class="label">검사 흐름과 실행</text>
  <text x="1130" y="201" font-size="17" class="teal label" text-anchor="end">5-6</text>
  <rect x="824" y="225" width="310" height="86" rx="12" fill="#0b1c2c" stroke="#244758"/>
  <circle cx="857" cy="256" r="17" fill="#164f60"/>
  <text x="857" y="262" font-size="17" class="teal label" text-anchor="middle">5</text>
  <text x="886" y="262" font-size="25" class="label">검사 흐름 만들기</text>
  <text x="886" y="290" font-size="17" class="muted">연결·저장 후 시험 결과 확인</text>
  <path d="M979 316 v8" class="line" marker-end="url(#arrow)"/>
  <rect x="824" y="328" width="310" height="86" rx="12" fill="#0b1c2c" stroke="#244758"/>
  <circle cx="857" cy="359" r="17" fill="#164f60"/>
  <text x="857" y="365" font-size="17" class="teal label" text-anchor="middle">6</text>
  <text x="886" y="365" font-size="25" class="label">검사 실행</text>
  <text x="886" y="393" font-size="17" class="muted">검사를 실행하고 기록 확인</text>
  <path d="M399 310 h18" class="line" marker-end="url(#arrow)"/>
  <path d="M779 310 h18" class="line" marker-end="url(#arrow)"/>
  <rect x="44" y="489" width="1112" height="115" rx="16" fill="#182b36" stroke="#705f3e"/>
  <rect x="66" y="508" width="174" height="28" rx="7" fill="#3d3b2c"/>
  <text x="153" y="528" font-size="16" class="warm label" text-anchor="middle">사람이 결정하는 경계</text>
  <text x="66" y="566" font-size="25" class="label">AI가 만든 초안은 사람이 검토한 뒤 채택합니다.</text>
  <text x="66" y="592" font-size="20" class="muted">정답 확정 · 최종 승인 · 운영 배포도 사람이 직접 확인합니다.</text>
  <text x="44" y="631" font-size="16" class="muted">작업 흐름을 설명한 도식입니다. 모델 성능이나 현장 수락을 뜻하지 않습니다.</text>
</svg>
